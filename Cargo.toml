[package]
name = "sites-entry"
version = "0.1.0"
edition = "2021"

[dependencies]
pingora = { version = "0.9", features = ["openssl", "proxy"] }
async-trait = "0.1"
tokio = { version = "1", features = ["net", "io-util", "time", "fs"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
fancy-regex = "0.13"
roxmltree = "0.20"
libc = "0.2"
